<style>
/* ── Button: no border, no generic outline, accessible focus-visible ring ── */
#feyn-chat-bubble {
  border: none !important;
  outline: none !important;
  /* shadow-only glow — no border artifact */
  box-shadow: 0 4px 24px rgba(14,165,233,0.30) !important;
}
#feyn-chat-bubble:hover {
  transform: scale(1.10);
  box-shadow: 0 6px 32px rgba(14,165,233,0.50) !important;
}
/* FIX: keyboard users still get a visible ring via :focus-visible */
#feyn-chat-bubble:focus-visible {
  outline: 2px solid #38bdf8 !important;
  outline-offset: 3px !important;
}

/* ── Panel open animation ── */
#feyn-chat-panel.show {
  display: flex !important;
  animation: feynSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes feynSlideUp {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)   scale(1);    }
}

/* ── Typing dots ── */
.typing-dot {
  width: 4px; height: 4px;
  background: #94a3b8;
  border-radius: 50%;
  animation: typingBlink 1.4s infinite both;
}
.typing-dot:nth-child(2) { animation-delay: 0.20s; }
.typing-dot:nth-child(3) { animation-delay: 0.40s; }
@keyframes typingBlink {
  0%, 80%, 100% { opacity: 0; transform: scale(0.8); }
  40%           { opacity: 1; transform: scale(1);   }
}

/* ── Message bubbles ── */
.feyn-msg {
  max-width: 85%;
  padding: 10px 14px;
  font-size: 13.5px;
  line-height: 1.55;
  word-break: break-word;
}
.feyn-msg-user {
  align-self: flex-end;
  background: #6366f1;
  color: #ffffff;
  border-radius: 18px 18px 4px 18px;
}
.feyn-msg-ai {
  align-self: flex-start;
  background: #1e293b;
  color: #e2e8f0;
  border-radius: 18px 18px 18px 4px;
  border: 1px solid #334155;
}
/* Inline code inside AI messages */
.feyn-msg-ai code {
  background: #0f172a;
  color: #7dd3fc;
  padding: 1px 5px;
  border-radius: 4px;
  font-family: 'Fira Code', monospace;
  font-size: 12px;
}
/* Bullet lists inside AI messages */
.feyn-msg-ai ul {
  margin: 6px 0 0 0;
  padding-left: 16px;
}
.feyn-msg-ai li { margin-bottom: 3px; }

/* ── Starter chips ── */
.starter-chip {
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.starter-chip:hover,
.starter-chip:focus-visible {
  background: #6366f1 !important;
  color: #ffffff !important;
  border-color: #6366f1 !important;
  outline: none;
}

/* ── Close & send button accessible focus ── */
#feyn-chat-close:focus-visible,
#feyn-send-btn:focus-visible {
  outline: 2px solid #38bdf8 !important;
  outline-offset: 2px !important;
  border-radius: 4px;
}

/* ── Scrollbar ── */
#feyn-chat-messages::-webkit-scrollbar       { width: 4px; }
#feyn-chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

@media (max-width: 767.98px) {
  #feyn-chat-panel {
    width: min(23.75rem, calc(100vw - 1.25rem)) !important;
    max-width: calc(100vw - 1.25rem) !important;
    height: min(32.5rem, calc(100vh - 7rem)) !important;
    max-height: calc(100vh - 7rem) !important;
    right: 0.625rem !important;
    bottom: 5.5rem !important;
  }
}

@media (max-width: 479.98px) {
  #feyn-chat-panel {
    width: calc(100vw - 1rem) !important;
    max-width: calc(100vw - 1rem) !important;
    height: min(70vh, 30rem) !important;
    max-height: min(70vh, 30rem) !important;
    right: 0.5rem !important;
    bottom: 5rem !important;
  }
  .feyn-msg {
    max-width: 92%;
    font-size: 0.8125rem;
  }
}

/* ── Respect reduced-motion preference ── */
@media (prefers-reduced-motion: reduce) {
  #feyn-chat-bubble,
  #feyn-chat-panel.show,
  .typing-dot { animation: none !important; transition: none !important; }
}

<script>
document.addEventListener('DOMContentLoaded', function () {

  /* ── Element refs ── */
  const bubble   = document.getElementById('feyn-chat-bubble');
  const panel    = document.getElementById('feyn-chat-panel');
  const closeBtn = document.getElementById('feyn-chat-close');
  const sendBtn  = document.getElementById('feyn-send-btn');
  const input    = document.getElementById('feyn-chat-input');
  const msgs     = document.getElementById('feyn-chat-messages');
  const typing   = document.getElementById('feyn-typing-indicator');
  const chips    = document.querySelectorAll('.starter-chip');

  /* ── Constants ── */
  const HISTORY_KEY = 'feyn_chat_history';
  const MAX_HISTORY = 40;   // cap to prevent sessionStorage bloat

  /* ── History: load & trim ── */
  let history = [];
  try {
    history = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || '[]');
    if (!Array.isArray(history)) history = [];
  } catch (_) { history = []; }

  /* Replay persisted messages into UI */
  if (history.length > 0) {
    history.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'ai', m.content, false));
  } else {
    appendMessage('ai',
      "Hi! I'm **Feyn**, your ML failure engine tutor. Ask me anything about your model investigation — data drift, PSI, root causes, severity levels, or **Explain my report** for a full walkthrough.",
      false);
  }

  /* ── Panel toggle ── */
  bubble.addEventListener('click', togglePanel);
  bubble.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePanel(); }
  });

  function togglePanel() {
    const isOpen = panel.classList.contains('show');
    panel.classList.toggle('d-none',  isOpen);
    panel.classList.toggle('show',   !isOpen);
    bubble.setAttribute('aria-expanded', String(!isOpen));
    if (!isOpen) { input.focus(); scrollBottom(); }
  }

  closeBtn.addEventListener('click', () => {
    panel.classList.add('d-none');
    panel.classList.remove('show');
    bubble.setAttribute('aria-expanded', 'false');
    bubble.focus();   // return focus to trigger — accessibility
  });

  /* Close on Escape */
  panel.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeBtn.click();
  });

  /* ── Send message ── */
  sendBtn.addEventListener('click', submitInput);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitInput(); }
  });
  chips.forEach(chip => chip.addEventListener('click', () => sendMessage(chip.textContent.trim())));

  function submitInput() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendMessage(text);
  }

  async function sendMessage(text) {
    appendMessage('user', text);
    scrollBottom();
    typing.classList.remove('d-none');
    typing.removeAttribute('aria-hidden');
    scrollBottom();

    try {
      /*
        FIX: smarter context capture.
        Prefer a dedicated report element, fall back to body text.
        This gives the backend more relevant signal than raw page text.
      */
      const reportEl = document.querySelector(
        '#feyn-report-summary, #investigation-output, [data-feyn-context]'
      );
      const context = reportEl
        ? reportEl.innerText.substring(0, 1500)
        : document.body.innerText.substring(0, 1000);

      const res  = await fetch('/api/chatbot/message', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history, context }),
      });

      const data = await res.json();
      typing.classList.add('d-none');
      typing.setAttribute('aria-hidden', 'true');

      if (data.success && data.reply) {
        appendMessage('ai', data.reply);
      } else {
        const err = data.error || "Sorry, I'm having trouble right now. Please try again.";
        appendMessage('ai', `⚠️ **Error:** ${err}`);
      }

    } catch (_) {
      typing.classList.add('d-none');
      typing.setAttribute('aria-hidden', 'true');
      appendMessage('ai',
        "⚠️ **Connection Error:** Could not reach the FeynML engine. " +
        "Check your terminal if running locally, or verify Render is active.");
    }

    scrollBottom();
  }

  /* ── Message rendering ── */
  function appendMessage(role, content, save = true) {
    const div = document.createElement('div');
    div.className = `feyn-msg feyn-msg-${role}`;
    div.innerHTML  = renderMarkdown(content);
    msgs.appendChild(div);

    if (save) {
      history.push({ role: role === 'user' ? 'user' : 'assistant', content });
      /* FIX: trim history to MAX_HISTORY entries (keep most recent) */
      if (history.length > MAX_HISTORY) {
        history = history.slice(history.length - MAX_HISTORY);
      }
      try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
      catch (_) { /* storage full — silently drop oldest on next save */ }
    }
  }

  /*
    FIX: richer markdown renderer (no external lib needed).
    Handles: **bold**, *italic*, `inline code`, newlines, and simple -/• bullet lists.
    All output is properly escaped first to prevent XSS.
  */
  function renderMarkdown(text) {
    // 1. Escape HTML entities
    let s = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // 2. Inline code (`...`) — before bold/italic so backtick content isn't mangled
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    // 3. Bold & italic
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*]+)\*\*/g,     '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g,         '<em>$1</em>');

    // 4. Bullet list lines (-, *, •)
    const lines = s.split('\n');
    let inList = false;
    const out  = [];
    for (const line of lines) {
      if (/^[-*•]\s+/.test(line)) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push('<li>' + line.replace(/^[-*•]\s+/, '') + '</li>');
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(line);
      }
    }
    if (inList) out.push('</ul>');

    // 5. Remaining newlines → <br>
    return out.join('\n').replace(/\n/g, '<br>');
  }

  function scrollBottom() {
    msgs.scrollTop = msgs.scrollHeight;
  }
});
</script>
